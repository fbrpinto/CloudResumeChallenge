# Frontend CI/CD Pipeline

name: Frontend Pipeline

# Trigger on push to 'main' branch, only for changes in 'frontend/' (or manually)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

# Allow requesting an OIDC token to sign in to AWS
permissions:
  id-token: write
  contents: read

jobs:
  # Test: Run Cypress tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start local server
        working-directory: frontend/public
        run: |
          python3 -m http.server 5000 &
          sleep 5

      - name: Install Cypress
        run: npm install cypress --save-dev

      - name: Run tests
        working-directory: frontend/tests
        run: npx cypress run

  # Deploy: Sync frontend code with S3
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: "eu-west-1"

      - name: Sync frontend code with S3 bucket
        run: aws s3 sync frontend/public s3://crc-fbrpinto-s3-tf --delete --no-progress

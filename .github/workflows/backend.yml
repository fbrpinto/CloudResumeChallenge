# Backend CI/CD Pipeline

name: Backend Pipeline

# Trigger on push to 'main' branch, only for changes in 'backend/' (or manually)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"

# Allow requesting an OIDC token to sign in to AWS
permissions:
  id-token: write
  contents: read

jobs:
  # Build: Package Lambda function
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Package Lambda function
        working-directory: backend
        run: ./package_lambda.sh

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lambda-function
          path: infrastructure/backend/lambda_functions/lambda_function_backend.zip

  # Test: Run unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install boto3 moto['dynamodb']

      - name: Run tests
        run: python backend/lambda_function_test.py

  # Deploy: Upload Lambda to AWS
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lambda-function
          path: /tmp

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: "eu-west-1"

      - name: Deploy Lambda
        run: aws lambda update-function-code --function-name crc-fbrpinto-lambda-tf --zip-file fileb:///tmp/lambda_function_backend.zip
